# Nginx reverse proxy for the Automation Framework API + Dashboard.
#
# Replace `your-domain.duckdns.org` with your actual hostname.
# After installing certs (e.g. via certbot), this template forwards HTTPS
# traffic to the local FastAPI on 127.0.0.1:8080.

upstream automation_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.duckdns.org;

    # Redirect HTTP -> HTTPS (after certbot run, swap server_name accordingly)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name your-domain.duckdns.org;

    # Provided by certbot:
    # ssl_certificate /etc/letsencrypt/live/your-domain.duckdns.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Body size for log/file uploads etc.
    client_max_body_size 25m;

    # Basic security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass http://automation_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Static assets: longer cache
    location /dashboard/static/ {
        proxy_pass http://automation_backend;
        proxy_cache_valid 200 1h;
        expires 1h;
    }
}
